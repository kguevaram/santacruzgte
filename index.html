<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página en Construcción</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #1a1a1a; /* Fondo oscuro elegante */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Reemplaza "construccion.png" con el nombre exacto de la imagen subida a tu servidor -->
        <img src="PaginaEnConstruccion.png" alt="Página en construcción - ¡Vuelve pronto!">
    </div>

</body>
</html>
